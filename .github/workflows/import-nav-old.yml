name: Repair NAV data JSON

on:
  push:
    paths:
      - '.github/workflows/import-nav-old.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unwrap and validate data.json
        run: |
          jq -e '.content | fromjson | type == "array"' data/data.json > /dev/null
          jq -r '.content' data/data.json > /tmp/data.json
          jq empty /tmp/data.json
          mv /tmp/data.json data/data.json
          echo 'data.json restored as a native JSON array.'

      - name: Validate NAV structure
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/data.json', 'utf8'));
          if (!Array.isArray(data)) throw new Error('Root must be an array');

          const taxonomies = new Set();
          let total = 0;
          for (const section of data) {
            if (!section || typeof section.taxonomy !== 'string') throw new Error('Invalid taxonomy');
            if (taxonomies.has(section.taxonomy)) throw new Error(`Duplicate taxonomy: ${section.taxonomy}`);
            taxonomies.add(section.taxonomy);

            const groups = [];
            if (Array.isArray(section.links)) groups.push(['__root__', section.links]);
            if (Array.isArray(section.list)) {
              for (const item of section.list) {
                if (!item || typeof item.term !== 'string' || !Array.isArray(item.links)) {
                  throw new Error(`Invalid subsection in ${section.taxonomy}`);
                }
                groups.push([item.term, item.links]);
              }
            }

            for (const [term, links] of groups) {
              const urls = new Set();
              for (const link of links) {
                if (!link || typeof link.title !== 'string' || typeof link.url !== 'string') {
                  throw new Error(`Invalid link in ${section.taxonomy} / ${term}`);
                }
                if (urls.has(link.url)) throw new Error(`Duplicate URL within ${section.taxonomy} / ${term}: ${link.url}`);
                urls.add(link.url);
                total++;
              }
            }
          }

          console.log(`Sections: ${data.length}`);
          console.log(`Websites: ${total}`);
          console.log('NAV data validation passed.');
          NODE

      - name: Commit repaired data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'fix: restore data.json as native JSON array'
            git push
          fi
