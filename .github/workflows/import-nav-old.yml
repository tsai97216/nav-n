name: Import NAV legacy data

on:
  push:
    paths:
      - '.github/workflows/import-nav-old.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and unwrap legacy data
        run: |
          curl -fsSL https://raw.githubusercontent.com/tsai97216/nav-old/main/data/data.json -o /tmp/legacy-wrapper.json
          jq -e '.content | type == "string"' /tmp/legacy-wrapper.json > /dev/null
          jq -r '.content' /tmp/legacy-wrapper.json > /tmp/data.json
          jq empty /tmp/data.json
          mv /tmp/data.json data/data.json
          echo "Legacy NAV data extracted and validated as JSON."

      - name: Validate structure and duplicates
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/data.json', 'utf8'));
          if (!Array.isArray(data)) throw new Error('Root must be an array');

          let total = 0;
          const taxonomies = new Set();
          for (const section of data) {
            if (!section || typeof section.taxonomy !== 'string') throw new Error('Invalid taxonomy');
            if (taxonomies.has(section.taxonomy)) throw new Error(`Duplicate taxonomy: ${section.taxonomy}`);
            taxonomies.add(section.taxonomy);

            const terms = Array.isArray(section.list) ? section.list : [];
            const sectionLinks = Array.isArray(section.links) ? section.links : [];
            const linksByTerm = new Map();

            for (const link of sectionLinks) {
              if (!link || typeof link.title !== 'string' || typeof link.url !== 'string') throw new Error(`Invalid link in ${section.taxonomy}`);
            }

            const validateLinks = (term, links) => {
              const urls = linksByTerm.get(term) ?? new Set();
              for (const link of links) {
                if (!link || typeof link.title !== 'string' || typeof link.url !== 'string') {
                  throw new Error(`Invalid link in ${section.taxonomy} / ${term}`);
                }
                if (urls.has(link.url)) throw new Error(`Duplicate URL within ${section.taxonomy} / ${term}: ${link.url}`);
                urls.add(link.url);
                total++;
              }
              linksByTerm.set(term, urls);
            };

            validateLinks('__root__', sectionLinks);

            for (const item of terms) {
              if (!item || typeof item.term !== 'string' || !Array.isArray(item.links)) {
                throw new Error(`Invalid subsection in ${section.taxonomy}`);
              }
              validateLinks(item.term, item.links);
            }
          }

          console.log(`Sections: ${data.length}`);
          console.log(`Websites: ${total}`);
          console.log('Cross-taxonomy duplicates are allowed.');
          console.log('Cross-subcategory duplicates are allowed.');
          NODE

      - name: Commit imported data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data.json
          if git diff --cached --quiet; then
            echo 'No data changes.'
          else
            git commit -m 'data: import complete NAV legacy dataset'
            git push
          fi

# Triggered by changes to this workflow so the import runs exactly once.
